name: Update Dashboard Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ophalen P2000 en Nieuws Feeds
        run: |
          # Stabiele directe RSS-feed voor P2000 Groningen
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://www.p2000-lock.nl/rss/groningen.xml" -o p2000.xml || true
          
          # Fallback naar een alternatieve feed als de eerste leeg is
          if [ ! -s p2000.xml ] || grep -q "403" p2000.xml; then
            curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://rss.p2000-alarmen.nl/groningen" -o p2000.xml || true
          fi

          # Eemskrant
          curl -s -L -A "Mozilla/5.0" "https://www.eemskrant.nl/feed/" -o eemskrant.xml || true

          # RTV Noord
          curl -s -L -A "Mozilla/5.0" "https://www.rtvnoord.nl/rss" -o rtvnoord.xml || true

      - name: Wijzigingen opslaan in repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add p2000.xml eemskrant.xml rtvnoord.xml || true
          git commit -m "Auto-update verse P2000 data" || exit 0
          git push
