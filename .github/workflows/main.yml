name: Fetch P2000 Data

on:
  schedule:
    - cron: '*/5 * * * * *' # Draait elke 5 minuten
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch P2000 RSS
        run: |
          curl -s "https://feed.alarmeringen.nl/groningen.rss" > p2000.xml
          # Omzetten van simpele XML naar een schone JSON voor de website
          python3 -c "
          import xml.etree.ElementTree as ET, json
          tree = ET.parse('p2000.xml')
          items = []
          for item in tree.findall('.//item'):
              title = item.find('title').text if item.find('title') is not None else ''
              pubDate = item.find('pubDate').text if item.find('pubDate') is not None else ''
              items.append({'title': title, 'pubDate': pubDate})
          with open('p2000.json', 'w') as f:
              json.dump(items[:20], f, indent=2)
          "

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add p2000.json
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Update P2000 data' && git push)
