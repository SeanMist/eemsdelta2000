name: Fetch P2000 Data

on:
  schedule:
    - cron: '*/5 * * * *' # Elke 5 minuten
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch P2000 RSS and convert to JSON
        run: |
          curl -s "https://feed.alarmeringen.nl/groningen.rss" > p2000.xml
          python3 -c "
          import xml.etree.ElementTree as ET, json
          try:
              tree = ET.parse('p2000.xml')
              items = []
              for item in tree.findall('.//item'):
                  title = item.find('title').text if item.find('title') is not None else ''
                  pubDate = item.find('pubDate').text if item.find('pubDate') is not None else ''
                  items.append({'title': title, 'pubDate': pubDate})
              with open('p2000.json', 'w') as f:
                  json.dump(items[:20], f, indent=2)
          except Exception as e:
              print('Error parsing XML:', e)
          "

      - name: Commit and push if changes exist
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add p2000.json
          # Controleer of er wijzigingen zijn; zo ja, commit en push, zo nee, doe niets (voorkomt crashes)
          git diff --staged --quiet || (git commit -m "Update P2000 data [skip ci]" && git push)
