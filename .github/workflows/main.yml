name: Update Dashboard Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ophalen P2000 en Nieuws Feeds
        run: |
          # P2000 feed ophalen
          curl -s -L -A "Mozilla/5.0" "https://feed.alarmeringen.nl/groningen.rss" -o p2000.xml || true
          if [ ! -s p2000.xml ]; then
            curl -s -L -A "Mozilla/5.0" "https://p2000.net/rss/groningen.xml" -o p2000.xml || true
          fi

          # Eemskrant feed ophalen
          curl -s -L -A "Mozilla/5.0" "https://www.eemskrant.nl/feed/" -o eemskrant.xml || true

          # RTV Noord feed ophalen
          curl -s -L -A "Mozilla/5.0" "https://www.rtvnoord.nl/rss" -o rtvnoord.xml || true

      - name: Wijzigingen opslaan in repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add p2000.xml eemskrant.xml rtvnoord.xml || true
          git commit -m "Auto-update P2000 en nieuws data" || exit 0
          git push
