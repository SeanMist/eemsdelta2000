<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Eemsdelta & Delfzijl Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #090d11;
      color: #f0f6fc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    
    header {
      background-color: #161b22;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #30363d;
    }
    header h1 { font-size: 2.2rem; color: #58a6ff; font-weight: 900; letter-spacing: 0.5px; }
    #clock { font-size: 2.4rem; font-weight: 900; color: #ffffff; letter-spacing: 1px; }
    
    .progress-bar-container { width: 100%; height: 8px; background: #21262d; }
    .progress-bar { height: 100%; width: 0%; background: #58a6ff; transition: width 0.1s linear; }

    main { flex: 1; position: relative; padding: 16px; overflow: hidden; }
    .slide {
      position: absolute;
      top: 16px; left: 16px; right: 16px; bottom: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease-in-out, visibility 0.4s;
      display: flex;
      flex-direction: column;
    }
    .slide.active { opacity: 1; visibility: visible; }

    .card {
      background: #161b22;
      border: 3px solid #30363d;
      border-radius: 18px;
      padding: 20px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Badges XXL */
    .badge {
      display: inline-block;
      padding: 8px 20px;
      font-weight: 900;
      border-radius: 12px;
      font-size: 1.4rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .bg-prio1 { background-color: #da3633; }
    .bg-prio2 { background-color: #d29922; color: #0d1117; }
    .bg-info { background-color: #238636; }
    .bg-prague { background-color: #8957e5; }
    .bg-rdw { background-color: #00529b; }
    .bg-rain { background-color: #1f6feb; }

    /* RDW Kentekenplaat Styling */
    .license-plate-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }
    .license-plate {
      background-color: #fecf00;
      color: #000000;
      border: 5px solid #000000;
      border-radius: 12px;
      padding: 10px 30px;
      font-family: 'Arial Black', sans-serif;
      font-size: 4.8rem;
      font-weight: 900;
      letter-spacing: 4px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
    }
    .license-plate .nl-flag {
      background-color: #003399;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 10px 8px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .p2000-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      flex: 1;
      margin-top: 10px;
      padding-right: 4px;
    }
    .p2000-row {
      background: #1c2128;
      border: 2px solid #30363d;
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .p2000-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .p2000-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }
    .p2000-time {
      font-size: 1.1rem;
      color: #8b949e;
      font-weight: 700;
    }

    .weather-temp-huge { font-size: 6rem; font-weight: 900; color: #ffffff; margin: 0; line-height: 0.9; }
    .grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px; }
    .grid-forecast { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 8px; }
    .grid-box { background: #21262d; padding: 14px; border-radius: 14px; border: 2px solid #30363d; text-align: center; }

    .countdown-number { font-size: 4rem; font-weight: 900; color: #d2a8ff; line-height: 1; }
    .countdown-label { font-size: 1.2rem; font-weight: 700; color: #8b949e; text-transform: uppercase; margin-top: 4px; }

    nav {
      background: #161b22;
      border-top: 3px solid #30363d;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 10px;
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: #30363d; cursor: pointer; }
    .dot.active { background: #58a6ff; transform: scale(1.3); }
  </style>
</head>
<body>

  <header>
    <h1>Eemsdelta / Delfzijl Live</h1>
    <div id="clock">--:--:--</div>
  </header>
  <div class="progress-bar-container"><div class="progress-bar" id="progress"></div></div>

  <main>
    <!-- Slide 1: Afteltimer Praag XXL -->
    <section id="slide-prague" class="slide active">
      <div class="card" style="justify-content: space-between;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #30363d; padding-bottom: 10px;">
          <h2 style="font-size: 2.2rem;">🇨🇿 Aftellen naar Praag!</h2>
          <span class="badge bg-prague">Vakantie</span>
        </div>

        <div style="text-align: center; margin: 10px 0;">
          <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 10px;">
            <svg width="80" height="50" viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 35 C10 30, 25 20, 45 20 L65 20 C75 20, 85 28, 90 35 L95 38 C98 40, 98 45, 95 45 L5 45 C2 45, 2 40, 5 38 Z" fill="#8957e5"/>
              <path d="M30 22 L45 10 L65 10 L72 22 Z" fill="#a575ff"/>
              <circle cx="25" cy="45" r="8" fill="#161b22" stroke="#ffffff" stroke-width="3"/>
              <circle cx="75" cy="45" r="8" fill="#161b22" stroke="#ffffff" stroke-width="3"/>
            </svg>
            <span style="font-size: 1.6rem; color: #8b949e; font-weight: 700;">Vertrek: Donderdag 9 Oktober om 17:00 uur</span>
          </div>

          <div class="grid-3">
            <div class="grid-box">
              <div class="countdown-number" id="cd-days">--</div>
              <div class="countdown-label">Dagen</div>
            </div>
            <div class="grid-box">
              <div class="countdown-number" id="cd-hours">--</div>
              <div class="countdown-label">Uren</div>
            </div>
            <div class="grid-box">
              <div class="countdown-number" id="cd-mins">--</div>
              <div class="countdown-label">Minuten</div>
            </div>
          </div>
        </div>

        <div class="grid-box" style="margin-top: 8px; background: #21262d;">
          <p style="font-size: 1.6rem; color: #3fb950; font-weight: 900;" id="cd-status">✈️ Koffers inpakken & go!</p>
        </div>
      </div>
    </section>

    <!-- Slide 2: P2000 Eemsdelta (Database Live) -->
    <section id="slide-p2000-eemsdelta" class="slide">
      <div class="card" style="justify-content: flex-start;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #30363d; padding-bottom: 10px; margin-bottom: 6px;">
          <h2 style="font-size: 2.2rem;">🚨 P2000 Live Meldingen Eemsdelta</h2>
          <span class="badge bg-prio1">EEMSDELTA</span>
        </div>
        <div id="p2000-eemsdelta-container" class="p2000-container">
          <p style="font-size: 1.4rem; color: #8b949e; text-align: center; margin-top: 40px;">Meldingen ophalen van server...</p>
        </div>
      </div>
    </section>

    <!-- Slide 3: P2000 Groningen (Database Live) -->
